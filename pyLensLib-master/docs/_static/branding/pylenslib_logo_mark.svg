<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">pyLensLib logo mark</title>
  <desc id="desc">Square logo mark with Einstein ring motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061326"/>
      <stop offset="1" stop-color="#0D223F"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#31D0AA"/>
      <stop offset="1" stop-color="#79E3FF"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE9A3"/>
      <stop offset="1" stop-color="#FFC86B"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="38" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="24" fill="url(#core)"/>
  <ellipse cx="128" cy="128" rx="80" ry="52" fill="none" stroke="url(#ring)" stroke-width="10"/>
  <ellipse cx="128" cy="128" rx="88" ry="34" fill="none" stroke="#A7EEFF" stroke-opacity="0.75" stroke-width="6"/>
  <path d="M36 116 C58 76, 98 64, 146 76" fill="none" stroke="#D2F6FF" stroke-width="9" stroke-linecap="round"/>
  <path d="M220 140 C198 180, 158 192, 110 180" fill="none" stroke="#D2F6FF" stroke-width="9" stroke-linecap="round"/>
</svg>
