<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" role="img" aria-labelledby="title desc">
  <title id="title">pyLensLib logo horizontal</title>
  <desc id="desc">Stylized Einstein ring logo with pyLensLib wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061326"/>
      <stop offset="1" stop-color="#0D223F"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#31D0AA"/>
      <stop offset="1" stop-color="#79E3FF"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE9A3"/>
      <stop offset="1" stop-color="#FFC86B"/>
    </radialGradient>
  </defs>

  <rect width="920" height="220" rx="28" fill="url(#bg)"/>

  <!-- Icon -->
  <g transform="translate(36,26)">
    <rect width="168" height="168" rx="24" fill="#0A1E36" stroke="#1E3757" stroke-width="2"/>
    <circle cx="84" cy="84" r="16" fill="url(#core)"/>
    <ellipse cx="84" cy="84" rx="52" ry="34" fill="none" stroke="url(#ring)" stroke-width="6"/>
    <ellipse cx="84" cy="84" rx="58" ry="22" fill="none" stroke="#A7EEFF" stroke-opacity="0.75" stroke-width="3"/>
    <path d="M26 78 C40 52, 66 44, 98 52" fill="none" stroke="#D2F6FF" stroke-width="5" stroke-linecap="round"/>
    <path d="M142 104 C128 130, 102 138, 70 130" fill="none" stroke="#D2F6FF" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(244,72)">
    <text x="0" y="56" fill="#EAF6FF" font-family="'Avenir Next','Segoe UI',sans-serif" font-size="70" font-weight="700" letter-spacing="0.5">pyLensLib</text>
    <text x="2" y="92" fill="#8FB7D8" font-family="'Avenir Next','Segoe UI',sans-serif" font-size="24" letter-spacing="1.2">GRAVITATIONAL LENSING SIMULATION TOOLKIT</text>
  </g>
</svg>
