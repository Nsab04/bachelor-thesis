name: docs

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Build docs with a reduced dependency set:
          # skip optional/non-portable runtime deps not needed for API docs generation.
          grep -Ev '^(g3read|py-sphviewer|PyQt6|lenstronomy)([<>=].*)?$|^[[:space:]]*#|^[[:space:]]*$' requirements.txt > /tmp/requirements-docs.txt
          pip install -r /tmp/requirements-docs.txt
          pip install sphinx furo

      - name: Build docs
        run: |
          PYTHONPATH=$(pwd) make -C docs clean html

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
